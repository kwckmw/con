<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Groundline · 하늘리버사이드 C블록 토공 관제</title>
<style>
:root{--ink:#24222b;--mut:#6f6a7a;--line:rgba(36,34,43,.1);--glass:rgba(255,255,255,.8);--acc:#f08a1c;--warn:#e0573a;--ok:#2f9e6b;
  --sans:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f3f0ea;color:var(--ink);font:13px/1.45 var(--sans)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.card{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.75);border-radius:16px;box-shadow:0 8px 28px rgba(60,50,80,.12),0 1px 0 rgba(255,255,255,.8) inset}
.night{--ink:#ecebf3;--mut:#a7a3b8}.night .card{background:rgba(30,30,44,.74);border-color:rgba(255,255,255,.08);color:#ecebf3}
#top{position:fixed;left:12px;right:12px;top:12px;display:flex;align-items:center;gap:8px;padding:8px 12px;z-index:6}
#top .logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em;font-size:16px;white-space:nowrap}
#top .logo i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#f6b23a,#f08a1c);display:block}
#top input,#top select{font:inherit;color:inherit;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.night #top input,.night #top select{background:rgba(255,255,255,.08)}
#search{flex:1;max-width:220px}#clock{font:600 14px var(--mono);white-space:nowrap}.sp{flex:1}
.pill{font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid var(--line);white-space:nowrap;cursor:pointer;color:inherit}
.night .pill{background:rgba(255,255,255,.08)}.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}.night .pill.on{background:#ecebf3;color:#24222b}
.grp{display:flex;gap:4px}
#alerts{position:relative}#alerts b{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;margin-left:4px}
#alertBox{position:absolute;right:0;top:36px;width:290px;padding:10px;display:none;font-size:12px;max-height:50vh;overflow:auto}#alertBox.open{display:block}#alertBox p{margin:0 0 6px}
#fleet{position:fixed;left:12px;right:12px;top:66px;display:flex;gap:6px;padding:6px 8px;z-index:5;overflow-x:auto;scrollbar-width:none}#fleet::-webkit-scrollbar{display:none}
.fl{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 7px;border-radius:11px;background:rgba(255,255,255,.5);white-space:nowrap;flex:none;font-size:11.5px}.night .fl{background:rgba(255,255,255,.07)}
.fl svg{width:30px;height:18px;fill:currentColor;flex:none;opacity:.85}.fl b{font:700 14px var(--mono);min-width:16px;text-align:center}
.fl button{width:26px;height:26px;border-radius:9px;border:1px solid var(--line);background:#fff;color:#24222b;font:700 16px/1 var(--sans);cursor:pointer;padding:0}.fl button:disabled{opacity:.3;cursor:default}.night .fl button{background:rgba(255,255,255,.85)}
#kpi{position:fixed;left:12px;top:122px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:310px;z-index:4}
.k{padding:9px 12px}.k .l{font-size:11.5px;color:var(--mut)}.k .v{font:700 19px/1.2 var(--mono);margin-top:2px;white-space:nowrap}.k .v small{font-size:11px;font-weight:500;color:var(--mut)}
.k .bar{height:5px;border-radius:3px;background:rgba(0,0,0,.08);margin-top:6px;overflow:hidden}.k .bar i{display:block;height:100%;background:var(--acc);width:0}
#panel{position:fixed;right:12px;top:122px;width:310px;padding:14px;z-index:4;max-height:calc(100vh - 250px);overflow:auto}
#panel h2{margin:0 0 2px;font-size:16px}#panel .st{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(240,138,28,.15);color:#b55f06;margin:4px 0 8px}
.night #panel .st{color:#ffb35c}
#panel dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin:8px 0 0}#panel dt{font-size:11px;color:var(--mut)}#panel dd{margin:0;font:600 14px var(--mono)}
#panel .prog{height:6px;border-radius:3px;background:rgba(0,0,0,.08);overflow:hidden;margin:6px 0}#panel .prog i{display:block;height:100%;background:var(--acc)}
#panel p{margin:8px 0 0;color:var(--mut);font-size:12.5px}
#panel .act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#panel .act button{font:600 12.5px var(--sans);padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:#fff;cursor:pointer}
#panel .act button.ghost{background:transparent;color:inherit}
#diag{width:100%;height:110px;display:block;margin-top:8px;border-radius:10px;background:rgba(255,255,255,.45)}.night #diag{background:rgba(255,255,255,.05)}
#tracker{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(940px,calc(100vw - 24px));padding:10px 12px;z-index:4}
#tracker .cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}#tracker .col{max-height:92px;overflow:auto}
#tracker .col{min-height:54px;border-radius:10px;background:rgba(255,255,255,.45);padding:6px}.night #tracker .col{background:rgba(255,255,255,.05)}
#tracker .col h3{margin:0 0 4px;font-size:11px;color:var(--mut);font-weight:600}
.tk{white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 6px;border-radius:8px;background:#fff;margin-top:3px;cursor:pointer;border:1px solid var(--line)}
.night .tk{background:rgba(255,255,255,.1)}.tk i{width:8px;height:8px;border-radius:50%;flex:none}.tk span{font:500 11px var(--mono);color:var(--mut);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#tracker .foot{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px}
#depth{flex:1;height:7px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden}#depth i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9a26b,#8b6a44)}
#label{position:fixed;pointer-events:none;z-index:7;padding:4px 9px;border-radius:9px;font-size:12px;font-weight:600;transform:translate(-50%,-140%);display:none;white-space:nowrap}
#hint{position:fixed;left:12px;top:300px;font-size:12px;color:var(--mut);z-index:3}
/* 직접 운전 */
#drive{position:fixed;inset:0;pointer-events:none;z-index:8;display:none}#drive.on{display:block}
#drive .hud{position:absolute;left:50%;top:122px;transform:translateX(-50%);padding:8px 14px;pointer-events:auto;display:flex;gap:10px;align-items:center;font-size:12.5px;white-space:nowrap}
#drive .hud b{font-family:var(--mono)}
#drive .hud button{font:600 12px var(--sans);padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--ink);color:#fff;cursor:pointer}
#drive .hud button.ghost{background:transparent;color:inherit}
.stick{position:absolute;bottom:150px;width:132px;height:132px;border-radius:50%;pointer-events:auto;touch-action:none;background:rgba(255,255,255,.55);border:1.5px solid rgba(36,34,43,.35);backdrop-filter:blur(6px)}
.stick.l{left:24px}.stick.r{right:24px}
.stick .knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#24222b;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.stick .knob::after{content:'';position:absolute;inset:16px;border-radius:50%;background:var(--acc)}
.stick em{position:absolute;font:600 10.5px var(--sans);color:#24222b;font-style:normal;white-space:nowrap}
.stick .t{top:-18px;left:50%;transform:translateX(-50%)}.stick .b{bottom:-18px;left:50%;transform:translateX(-50%)}.stick .lf{left:-6px;top:50%;transform:translate(-100%,-50%)}.stick .rt{right:-6px;top:50%;transform:translate(100%,-50%)}
.night .stick em{color:#ecebf3}.stick .cap{display:none}
#keys{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);padding:8px 12px;font-size:11.5px;color:var(--mut);pointer-events:none;text-align:center}
body.driving #panel{max-height:calc(100vh - 480px)}
body.touring #panel{display:none}
#tourTag{position:fixed;left:50%;top:122px;transform:translateX(-50%);padding:7px 14px;z-index:7;display:none;font-size:13px;font-weight:600}
@media (max-width:900px){
  #weather,#search,#site,#hint{display:none}#top{left:8px;right:8px;top:8px;padding:6px 8px;gap:5px;overflow-x:auto}#top .logo span{display:none}#top .logo{font-size:14px}#top .logo i{width:18px;height:18px}
  .pill{padding:4px 7px;font-size:11px}#clock{font-size:12px}
  #fleet{top:52px;left:8px;right:8px;padding:5px 6px;gap:5px}.fl span{display:none}.fl{padding:2px 4px 2px 6px}.fl button{width:30px;height:30px}
  #kpi{top:102px;left:8px;right:8px;width:auto;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.k{padding:6px 8px}.k .v{font-size:13.5px}.k .l{font-size:10px}.k .v small{display:none}.k .bar{display:none}
  #panel{top:auto;bottom:128px;left:8px;right:8px;width:auto;max-height:38vh}#panel.empty{display:none}#diag{height:80px}
  #tracker{bottom:8px;width:calc(100vw - 16px);padding:8px}#tracker .col{min-height:30px;padding:4px}#tracker .col h3{font-size:10px}.tk{font-size:11px;padding:2px 4px}.tk span{display:none}
  .stick{bottom:64px;width:116px;height:116px}.stick.l{left:16px}.stick.r{right:16px}.stick em{font-size:10px}.stick .lf,.stick .rt{display:none}.stick .cap{display:block;bottom:-34px;left:50%;transform:translateX(-50%)}#keys{display:none}
  #drive .hud{top:102px;left:8px;right:8px;transform:none;flex-wrap:wrap;white-space:normal;font-size:11.5px;gap:6px;padding:8px}#drive .hud button{padding:5px 8px;font-size:11px}
  body.driving #kpi{display:none}body.touring #kpi{display:none}
  body.driving #panel,body.driving #tracker{display:none}
}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="공사현장 3D 화면. 드래그로 회전, 휠이나 두 손가락으로 확대, 장비를 누르면 정보가 나옵니다."></canvas>
<header id="top" class="card">
  <div class="logo"><i></i>Groundline<span style="font-weight:500;color:var(--mut);font-size:12px;margin-left:4px">토공 관제</span></div>
  <input id="search" placeholder="장비 검색 (EX-02, DT-05, WL-01)" aria-label="장비 검색">
  <select id="site" aria-label="현장 선택"><option>하늘리버사이드 C블록</option><option disabled>A블록 (준비 중)</option></select>
  <div class="sp"></div>
  <span id="weather" class="pill" style="cursor:default">맑음 18°C</span>
  <span id="clock">07:00</span>
  <div class="grp"><button class="pill" data-sp="1">1×</button><button class="pill on" data-sp="4">4×</button><button class="pill" data-sp="16">16×</button><button class="pill" data-sp="32">32×</button></div>
  <button class="pill" id="ringBtn">안전반경</button>
  <button class="pill" id="tourBtn">투어</button>
  <button class="pill" id="night">야간</button>
  <div id="alerts"><button class="pill" id="alertBtn">알림<b id="alertN">0</b></button><div id="alertBox" class="card"></div></div>
</header>
<section id="fleet" class="card" aria-label="장비 대수 조정"></section>
<section id="kpi">
  <div class="k card"><div class="l">오늘 굴착 (본바닥)</div><div class="v" id="k1">0<small> m³</small></div><div class="bar"><i id="k1b"></i></div></div>
  <div class="k card"><div class="l">반출 (흐트러진 상태)</div><div class="v" id="k2">0<small> m³</small></div></div>
  <div class="k card"><div class="l">평균 사이클</div><div class="v" id="k3">-<small> 초</small></div></div>
  <div class="k card"><div class="l">트럭 대기 합계</div><div class="v" id="k4">0<small> 분</small></div></div>
  <div class="k card"><div class="l">골조 진행</div><div class="v" id="k5">0<small> / 156 부재</small></div><div class="bar"><i id="k5b"></i></div></div>
  <div class="k card"><div class="l">연료 사용</div><div class="v" id="k6">0<small> L</small></div></div>
</section>
<aside id="panel" class="card empty"></aside>
<section id="tracker" class="card">
  <div class="cols" id="cols"></div>
  <div class="foot"><span>굴착 진행</span><div id="depth"><i></i></div><span id="depthV" style="font-family:var(--mono)">0%</span></div>
</section>
<div id="label" class="card"></div>
<div id="tourTag" class="card"></div>
<div id="drive">
  <div class="hud card"><span id="dName">EX-01 직접 운전</span><span>버킷 <b id="dFill">0%</b></span><span>날 깊이 <b id="dDepth">-</b></span>
    <button class="ghost" id="dView">운전석 시점</button><button class="ghost" id="dSend">트럭 출발</button><button id="dExit">자동으로 돌아가기</button></div>
  <div class="stick l" id="stL"><div class="knob"></div><em class="t">암 펴기</em><em class="b">암 당기기</em><em class="lf">좌선회</em><em class="rt">우선회</em><em class="cap">↔ 선회</em></div>
  <div class="stick r" id="stR"><div class="knob"></div><em class="t">붐 내리기</em><em class="b">붐 올리기</em><em class="lf">버킷 오므리기</em><em class="rt">버킷 펴기</em><em class="cap">↔ 버킷 오므림 · 폄</em></div>
  <div id="keys" class="card">왼손 W/S 암 · A/D 선회 &nbsp;|&nbsp; 오른손 ↑/↓ 붐 · ←/→ 버킷 &nbsp;(ISO 조작 방식)</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){'use strict';
var T=window.THREE;if(!T||!T.OrbitControls){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:0;display:grid;place-items:center">3D 라이브러리를 불러오지 못했습니다. 네트워크를 확인해 주세요.</p>');return}
var V3=T.Vector3,M4=T.Matrix4,INK=0x1C1B19;
var simT=7*3600;
var C={Y:0xF7F4EC,YD:0xE6DFCF,ST:0xE3E0D8,HUB:0xA8A193,DK:0x8C8577,GR:0xD8D2C4,BELT:0x9A9384,SHOE:0x8C8577,TL:0xC9DCE0,CH:0xFFFFFF,GL:0xDCEBF0,SOIL:0x9C7B57};
function M(c,o){o=o||{};
  var m=new T.MeshStandardMaterial({color:c,roughness:o.r!==undefined?o.r:.85,metalness:o.m!==undefined?o.m:.04});
  if(o.op!==undefined){m.transparent=true;m.opacity=o.op;m.depthWrite=false}
  m.userData.bo=m.opacity;m.userData.bt=m.transparent;m.userData.bd=m.depthWrite;m.userData.bc=m.color.clone();return m}
function MB(c){var m=new T.MeshBasicMaterial({color:c});m.userData.bo=1;m.userData.bt=false;m.userData.bd=true;return m}
function edgeMat(){var m=new T.LineBasicMaterial({color:INK});m.userData.bo=1;m.userData.bt=false;m.userData.bd=true;m.userData.edge=true;return m}
var EC={};
function edgesOf(g){return EC[g.uuid]||(EC[g.uuid]=new T.EdgesGeometry(g,30))}
function noRay(){}

function rbox(w,h,d,r,m){
  var x=-w/2,y=-h/2,s=new T.Shape();r=Math.max(.005,Math.min(r,w/2-.002,h/2-.002));
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);
  s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
  var b=Math.min(.03,d/2-.002),dd=Math.max(d-2*b,.002);
  var g=new T.ExtrudeGeometry(s,{depth:dd,bevelEnabled:true,bevelThickness:b,bevelSize:b*.8,bevelSegments:2,curveSegments:5});
  g.translate(0,0,-dd/2);return new T.Mesh(g,m)}
function rb(w,h,d,r,m,x,y,z){var o=rbox(w,h,d,r,m);o.position.set(x,y,z);return o}
function bx(w,h,d,m,x,y,z){var o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);return o}
function cz(r,len,m,x,y,z,seg){var o=new T.Mesh(new T.CylinderGeometry(r,r,len,seg||24),m);o.rotation.x=Math.PI/2;o.position.set(x,y,z);return o}
function cy(r,len,m,x,y,z,seg){var o=new T.Mesh(new T.CylinderGeometry(r,r,len,seg||24),m);o.position.set(x,y,z);return o}
function cx(r,len,m,x,y,z,seg){var o=new T.Mesh(new T.CylinderGeometry(r,r,len,seg||24),m);o.rotation.z=Math.PI/2;o.position.set(x,y,z);return o}
function ext(shape,depth,m,bev){
  var b=bev||0,o={depth:Math.max(depth-2*b,.002),bevelEnabled:b>0,bevelThickness:b,bevelSize:b,bevelSegments:1,curveSegments:16};
  var g=new T.ExtrudeGeometry(shape,o);g.translate(0,0,-o.depth/2);return new T.Mesh(g,m)}
function beamShape(pts,hw){
  var n=pts.length,L=[],R=[],i;
  function dir(a,b){var dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]}
  for(i=0;i<n;i++){
    var d1=i>0?dir(pts[i-1],pts[i]):dir(pts[0],pts[1]);
    var d2=i<n-1?dir(pts[i],pts[i+1]):d1;
    var n1=[-d1[1],d1[0]],n2=[-d2[1],d2[0]],nx=n1[0]+n2[0],ny=n1[1]+n2[1],l=Math.hypot(nx,ny)||1;
    nx/=l;ny/=l;var k=1/Math.max(.5,nx*n1[0]+ny*n1[1]);
    L.push([pts[i][0]+nx*hw[i]*k,pts[i][1]+ny*hw[i]*k]);
    R.push([pts[i][0]-nx*hw[i]*k,pts[i][1]-ny*hw[i]*k]);
  }
  var s=new T.Shape();s.moveTo(L[0][0],L[0][1]);
  for(i=1;i<n;i++)s.lineTo(L[i][0],L[i][1]);
  for(i=n-1;i>=0;i--)s.lineTo(R[i][0],R[i][1]);
  s.closePath();return s}

  {n:'노반 정지 · 그레이더',d:9,f:function(u,p,t){var g=FLEET.filter(function(A){return A.kind==='mg'})[0],x=g?g.x:100,z=g?g.z:12;p.set(x+16,8,z+15);t.set(x+2,.8,z)}},
  {n:'관로 굴착 · 휠 굴삭기와 스키드로더',d:10,f:function(u,p,t){var g=FLEET.filter(function(A){return A.kind==='wx'})[0],x=g?g.x:80;p.set(x+lerp(20,6,u),9,45);t.set(x+5,0,28)}}];
function startTour(){tour.on=true;document.body.classList.add('touring');tour.i=0;tour.t=0;controls.enabled=false;select(null);document.getElementById('tourBtn').classList.add('on');tourTag.style.display='block'}
function stopTour(){tour.on=false;document.body.classList.remove('touring');controls.enabled=!cabView;document.getElementById('tourBtn').classList.remove('on');tourTag.style.display='none'}
document.getElementById('tourBtn').addEventListener('click',function(){if(tour.on)stopTour();else startTour()});
var _tp=new V3(),_tt=new V3();
function tourStep(dt){var S=SHOTS[tour.i];tour.t+=dt;var u=Math.min(1,tour.t/S.d);S.f(u,_tp,_tt);var k=tour.t<1.6&&tour.i+tour.t>0?sm(tour.t/1.6):1;
  if(tour.t<dt*1.5&&tour.first!==false){camera.position.copy(_tp);controls.target.copy(_tt);tour.first=false}
  camera.position.lerp(_tp,k<1?.06:.2);controls.target.lerp(_tt,k<1?.06:.2);camera.lookAt(controls.target);tourTag.textContent='투어 '+(tour.i+1)+'/'+SHOTS.length+' · '+S.n;
  if(tour.t>=S.d){tour.i=(tour.i+1)%SHOTS.length;tour.t=0}}

/* ---------- 루프 ---------- */
function resize(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<700?42:30;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
controls.addEventListener('start',function(){camGoal=null;distGoal=null;follow=false});
var fleetT=0;
function simAdvance(dt){var n=Math.ceil(dt/.05),sdt=dt/n;for(var i=0;i<n;i++){simT+=sdt;EXS.forEach(function(E){if(!E.off)E.step(sdt)});autoReset(sdt);TRUCKS.slice().forEach(function(t){t.step(sdt)});stepCrane(sdt);spreadPiles(sdt);stepSite2(sdt);
    fleetT+=sdt;if(fleetT>1){fleetT=0;fleetTrucks()}}}
function surfaces(){PITF.update();YARDP.update();TRUCKS.forEach(function(t){t.api.heap.update()});HF2.forEach(function(h){h.update()})}
var last=performance.now(),uiT=0,bl=0,dv=new V3(),cpos=new V3(),surfT=0,_cab=new V3(),_fw=new V3();
function frame(now){requestAnimationFrame(frame);var rdt=Math.min(.05,(now-last)/1000);last=now;var dt=driving?rdt:rdt*speedX;
  if(driving)driveStep(rdt);
  simAdvance(dt);applyNight(rdt);stepCars(rdt);stepParticles(rdt);craneRender(now/1000);crewUpdate();
  surfT+=rdt;if(surfT>.12){surfT=0;surfaces()}
  bl+=rdt;TM.BEACON.emissiveIntensity=(Math.sin(bl*8)>0?2.2:0)*Math.max(.35,nightK);
  if(driving&&cabView){var E=driving,yw=E.yaw+E.p.sw,c=Math.cos(yw),s=Math.sin(yw);_cab.set(E.x+c*.35+s*-.87,2.42+E.y,E.z-s*.35+c*-.87);camera.position.copy(_cab);
    _fw.set(E.x+c*8+s*-.3,E.y-.6,E.z-s*8+c*-.3);controls.target.copy(_fw);camera.lookAt(_fw);if(camera.fov!==62){camera.fov=62;camera.updateProjectionMatrix()}}
  else if(camera.fov===62){resize()}
  else if(tour.on)tourStep(rdt);
  else if(selected){selected.obj.getWorldPosition(cpos);if(selected.kind==='truck'){cpos.set(selected.ref.po.ax*.4+selected.ref.po.gx*.6,0,selected.ref.po.az*.4+selected.ref.po.gz*.6)}
    ring.position.set(cpos.x,.08,cpos.z);ring.material.opacity=.55+.3*Math.sin(now/300);pin.position.set(cpos.x,(selected.kind==='crane'?38:selected.kind==='ex'||selected.kind==='fleet'&&selected.ref.kind==='wx'?6.5:5.4)+Math.sin(now/400)*.3,cpos.z);
    if(follow&&selected.kind!=='crane'){var tgt=cpos.clone();tgt.y=1.5;var prev=controls.target.clone();controls.target.lerp(tgt,Math.min(1,rdt*(camGoal?3:2)));camera.position.add(dv.subVectors(controls.target,prev))}
    if(camGoal){dv.copy(camera.position).sub(controls.target);var cd=dv.length();dv.setLength(cd+(distGoal-cd)*Math.min(1,rdt*3));camera.position.copy(controls.target).add(dv);if(Math.abs(distGoal-cd)<.3)camGoal=null}}
  if(!tour.on&&!(driving&&cabView))controls.update();
  renderer.render(scene,camera);
  uiT+=rdt;if(uiT>.2){uiT=0;renderKPI();renderTracker();renderPanel(false);checkAlerts()}}
requestAnimationFrame(frame);
window.GL={tpos:function(i){var o=TRUCKS[i].po;return [o.ax,o.az,o.gx,o.gz,TRUCKS[i].yf]},step:function(s){simAdvance(s);surfaces();renderKPI();renderTracker();renderPanel(false)},speed:function(x){speedX=x},night:function(){document.getElementById('night').click()},
  cam:function(p,q){camera.position.set(p[0],p[1],p[2]);controls.target.set(q[0],q[1],q[2]);controls.update()},select:function(id){select(SEL.find(function(s){return s.ref.id===id})||null)},
  fleet:function(k,n){setCount(k,n);return FC},fc:function(){return {fc:FC,trucks:TRUCKS.length,fleet:FLEET.map(function(A){return A.id+':'+A.state+':'+A.count+':'+A.vol.toFixed(1)+':'+A.x.toFixed(1)+','+A.z.toFixed(1)}),pad:[PADLVL,+padFrac().toFixed(2),+PADF.total().toFixed(0)],bor:+BORF.total().toFixed(0),bed:+bedFrac().toFixed(3),tr:TSEG.map(function(g){return +g.bedX.toFixed(1)})}},
  state:function(){return {k:EXS.map(function(E){return E.k}),zn:ZONE.n+(ZONE.loop?ZONE.loop.id:''),t:fmtT(simT),dug:+(EX1.dug+EX2.dug).toFixed(2),deliv:+DELIV.toFixed(1),ex:EXS.map(function(E){return E.id+':'+E.state+':'+E.cycles+':'+E.fill.toFixed(2)}),
    trucks:TRUCKS.map(function(t){return t.id+':'+t.state+':'+t.load.toFixed(1)}),crane:CRANE.phase+':'+BLD.next,col:collisions()}},
  collisions:collisions,drive:function(id){startDrive(EXS.find(function(E){return E.id===id}))},stick:function(l,r){stick.l=l;stick.r=r},stopDrive:stopDrive,tour:startTour,stopTour:stopTour,cab:function(){document.getElementById('dView').click()},
  minGap:function(){var m=1e9;[LN,LS].forEach(function(L){L.trucks.forEach(function(a){L.trucks.forEach(function(b){if(a!==b)m=Math.min(m,L.fwd(a.s,b.s)-ADT.LEN)})})});return m},
  dbg:function(){return {sLoad:[EX1.sLoad,EX2.sLoad],L:[LN.L,LS.L],zone:[LN.zone,LS.zone,LN.sDump,LS.sDump],ld:EXS.map(function(E){return [E.loadSpot.x,E.loadSpot.z]}),mouth:EXS.map(function(E){return [E.mouthW.x,E.mouthW.y,E.mouthW.z].map(function(v){return +v.toFixed(2)})})}}};
